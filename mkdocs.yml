site_name: SQL_DEPOT_IA
site_description: Cours complet de SQL - 5 niveaux progressifs
site_url: https://ikkiphenixluigi.github.io/SQL_DEPOT_IA/
repo_url: https://github.com/ikkiphenixluigi/SQL_DEPOT_IA

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  palette:
    - scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode

markdown_extensions:
  - pymdownx.highlight:
      use_pygments: true
  - pymdownx.superfences
  - codehilite
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Accueil: index.md
  - Cours:
      - Introduction: cours/00_intro.md
      - NIVEAU 1:
          - SELECT, FROM et DISTINCT: cours/01_niveau1_01_SELECT_FROM.md
          - WHERE (TOUT): cours/02_niveau1_02_WHERE.md
          - ORDER BY: cours/03_niveau1_03_ORDER_BY.md
          - LIMIT: cours/04_niveau1_04_LIMIT.md
          - Test NIVEAU 1: cours/05_niveau1_05_TEST.md
      - NIVEAU 2:
          - Fonctions numeriques:
              - Operations et ROUND: cours/08_niveau2_01_operations_ROUND.md
              - CEIL, FLOOR, ABS: cours/09_niveau2_02_CEIL_FLOOR_ABS.md
              - POWER, SQRT: cours/10_niveau2_03_POWER_SQRT.md
          - Fonctions texte:
              - UPPER, LOWER, LENGTH: cours/11_niveau2_04_UPPER_LOWER_LENGTH.md
              - SUBSTR, REPLACE: cours/12_niveau2_05_SUBSTR_REPLACE.md
              - TRIM et concatenation: cours/13_niveau2_06_TRIM_concat.md
              - LIKE: cours/14_niveau2_07_LIKE.md
              - CAST: cours/15_niveau2_08_CAST.md
          - Fonctions date:
              - strftime(): cours/16_niveau2_09_strftime.md
              - Calcul d'age: cours/17_niveau2_10_age.md
          - Fonctions avancees:
              - CASE WHEN: cours/18_niveau2_11_CASE_WHEN.md
          - Test NIVEAU 2: cours/19_niveau2_TEST.md
      - NIVEAU 3:
          - Agregats: cours/20_niveau3_01_agregats.md
          - GROUP BY: cours/21_niveau3_02_GROUP_BY.md
          - HAVING + Syntaxe: cours/22_niveau3_03_HAVING_syntaxe.md
          - Test NIVEAU 3: cours/23_niveau3_TEST.md
      - NIVEAU 4:
          - JOIN base: cours/24_niveau4_01_JOIN_base.md
          - JOIN multiple: cours/25_niveau4_02_JOIN_multiple.md
          - JOIN avance: cours/26_niveau4_03_JOIN_avance.md
          - Test NIVEAU 4: cours/27_niveau4_TEST.md
      - NIVEAU 5:
          - Sous-requetes IN: cours/28_niveau5_01_sous_requetes_IN.md
          - Sous-requetes comparatives: cours/29_niveau5_02_sous_requetes_compare.md
          - Sous-requetes correlees: cours/30_niveau5_03_sous_requetes_corellees.md
          - Test NIVEAU 5: cours/31_niveau5_TEST.md
  - SQL:
      - Creation des tables: sql/01_create_tables.sql
      - Insertion des donnees: sql/02_insert_data.sql
  - Guides:
      - GUIDE_TEST: GUIDE_TEST.md
      - GUIDE_DB_BROWSER: GUIDE_DB_BROWSER.md
      - GUIDE_DBEAVER: GUIDE_DBEAVER.md
